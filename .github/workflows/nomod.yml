name: nomod CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

jobs:
  build1:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
         submodules: recursive                
    - name: apt-get
      run: |
         set -x
         sudo apt-get update
         sudo apt-get install git build-essential fakeroot libncurses5-dev libssl-dev ccache dfu-util u-boot-tools device-tree-compiler libssl-dev mtools bc python3 cpio zip unzip rsync file wget libiio-dev libncurses5-dev build-essential bison flex libssl-dev bc libmpc-dev

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(/bin/date -u "+%Y%m%d-%H:%M:%S")" >> $GITHUB_OUTPUT
      shell: bash
      
    - name: Cache
      uses: actions/cache@v4
      with:
        # A list of files, directories, and wildcard patterns to cache and restore
        path: plutosdr-fw/buildroot/dl/
        # An explicit key for restoring and saving the cache
        key: plutodl-${{ steps.get-date.outputs.date }}
        restore-keys: plutodl-
        
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ runner.os }}
        
    - name: configure buildroot
      env:
          SKIP_LEGAL: 1
      run: |
          set -x -e
          
          export BR2_USE_CCACHE=1
          export BR2_CCACHE_DIR=$(pwd)/.ccache
          
          cd plutosdr-fw
          touch buildroot/board/pluto/msd/LICENSE.html

          # Apply buildroot patches for static library builds
          echo "Applying buildroot patches for static library support..."
          cd buildroot
          if ! git apply --check --reverse ../../buildroot_static_libs.patch 2>/dev/null; then
              echo "Applying buildroot static library patch..."
              git apply ../../buildroot_static_libs.patch
          else
              echo "Buildroot patch already applied"
          fi
          cd ..
          
          echo "BR2_CCACHE=y" >> buildroot/configs/zynq_pluto_defconfig
          
          echo "BR2_PACKAGE_LIQUID_DSP_FAST=y" >> buildroot/configs/zynq_pluto_defconfig

          sed -i 's/38483f31be391af66b35542f733e569febe13d3a/a0eca0d/g' buildroot/package/libiio/libiio.mk         
          echo sha256 3b743ead3675af5f7812a0f79da719ad18e4f398ba8a861f0c2aa4ede1d0964b libiio-a0eca0d-br1.tar.gz >> buildroot/package/libiio/libiio.hash

          sed -i 's/26aedd8021fa939ab2f53e55904d869207265242fef7ad86aa4673e219b7cbef/4814915de63d975807e918df82bb86021d0e78839e8cc4116a36476d0b33180c/g' buildroot/package/ad936x_ref_cal/ad936x_ref_cal.hash

          
          make -C buildroot ARCH=arm zynq_pluto_defconfig
          make -C buildroot toolchain
          make -C buildroot libiio
          #make -C buildroot liquid-dsp
          make -C buildroot libad9361-iio
          make -C buildroot ad936x_ref_cal
          make -C buildroot libini
          make -C buildroot zlib
          
          make -C buildroot fftw-double 
          make -C buildroot fftw-single 
          
          export PATH=`pwd`/buildroot/output/host/bin:`pwd`/buildroot/output/host/sbin:${PATH}
          export CROSS_COMPILE="arm-linux-gnueabihf-"
          export SYSROOT=`pwd`/buildroot/output/host/arm-buildroot-linux-gnueabihf/sysroot/
          
          git tag v0.34 || true
          
          sudo update-ccache-symlinks
          
          which ${CROSS_COMPILE}gcc         
          
          cd ..       
          
          
          cd third_party/libtuntap
          sed -i 's\/usr/include/\\g' CMakeLists.txt
          sed -i 's\/usr/local/include\\g' CMakeLists.txt
          mkdir build
          cd build
          cmake .. -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++
          make
          cp lib/*.a ../
          cp tuntap-export.h ../
          cd ..
          cd ..
          cd ..
          
          cd third_party/libfec
          make 
          cp fec.h ../../plutosdr-fw/buildroot/output/host/arm-buildroot-linux-gnueabihf/sysroot/usr/include/
          cp *.a ../../plutosdr-fw/buildroot/output/host/arm-buildroot-linux-gnueabihf/sysroot/usr/lib/
          cp *.a ../../plutosdr-fw/buildroot/output/target/usr/lib/
          cd .. 
          cd ..
          
          cd plutosdr-fw
          make -C buildroot liquid-dsp
          cd ..
          
          make
          #cp third_party/libfec/*.so ./plutosdr-fw/buildroot/output/target/usr/lib
          cp charon ./plutosdr-fw/buildroot/output/target/usr/bin
          
          arm-linux-gnueabihf-objdump -S -g -w -l --disassemble charon > out.txt


    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build2
        path: |
          charon
          out.txt

    - name: build
      env:
          SKIP_LEGAL: 1
      run: |
          set -x -e
          
          export BR2_USE_CCACHE=1
          export BR2_CCACHE_DIR=$(pwd)/.ccache
          export XSA_URL=https://github.com/analogdevicesinc/plutosdr-fw/releases/download/v0.38/system_top.xsa
          #               http://github.com/analogdevicesinc/plutosdr-fw/releases/download/${LATEST_TAG}/system_top.xsa
          
          echo "CONFIG_TUN=y" >> plutosdr-fw/linux/arch/arm/configs/zynq_pluto_defconfig
          echo "CONFIG_BRIDGE=y" >> plutosdr-fw/linux/arch/arm/configs/zynq_pluto_defconfig
          echo "CONFIG_BATMAN_ADV=y" >> plutosdr-fw/linux/arch/arm/configs/zynq_pluto_defconfig
          echo "CONFIG_MODULES=y" >> plutosdr-fw/linux/arch/arm/configs/zynq_pluto_defconfig
          echo "CONFIG_MODULE_UNLOAD=y" >> plutosdr-fw/linux/arch/arm/configs/zynq_pluto_defconfig
          echo "CONFIG_MODULE_FORCE_UNLOAD=y" >> plutosdr-fw/linux/arch/arm/configs/zynq_pluto_defconfig
          echo "CONFIG_MODVERSIONS=y" >> plutosdr-fw/linux/arch/arm/configs/zynq_pluto_defconfig
          echo "CONFIG_SYSCTL_SYSCALL=y" >> plutosdr-fw/linux/arch/arm/configs/zynq_pluto_defconfig

          echo "CONFIG_TUNCTL=y" >> plutosdr-fw/buildroot/board/pluto/busybox-1.25.0.config
          echo "CONFIG_BRCTL=y" >> plutosdr-fw/buildroot/board/pluto/busybox-1.25.0.config
          echo "CONFIG_TASKSET=y" >> plutosdr-fw/buildroot/board/pluto/busybox-1.25.0.config
          
          cd plutosdr-fw

          make -C buildroot batctl

          make pluto.frm pluto.dfu zip-all

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          plutosdr-fw/pluto.frm
          plutosdr-fw/pluto.dfu
          plutosdr-fw/*.zip
          
